<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="description" content="نمایش قیمت شاخص‌های منتخب بازار از منبع داده TGJU">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>قیمت بازار TGJU</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:#fff;font-family:Arial,sans-serif}
main{width:min(720px,100%);margin:10px auto;background:#181818;border-radius:16px;padding:14px}
h1{text-align:center;font-size:24px;margin:0 0 4px}
.controls{text-align:center;margin:0 0 2px;display:flex;justify-content:center;gap:5px;flex-wrap:wrap}
button{font-family:inherit}
.controlBtn{background:#2a2a2a;color:#fff;border:1px solid #444;border-radius:8px;padding:7px 15px;font-size:16px;cursor:pointer}
.controlBtn:disabled{opacity:.5;cursor:default}
.row{display:grid;grid-template-columns:minmax(92px,1fr) minmax(0,1.7fr) minmax(112px,1fr);align-items:center;gap:5px;padding:5px 2px;border-bottom:1px solid #2b2b2b;min-height:46px}
.name{min-width:0;color:#ddd;font-size:17px;text-align:right;white-space:nowrap}
.price{min-width:0;text-align:center;font-size:20px;font-weight:bold;direction:ltr;white-space:nowrap;font-variant-numeric:tabular-nums}
.price.up{color:#55c878}.price.down{color:#ef6666}.price.flat{color:#e5c04a}
.meta{min-width:0;text-align:left;direction:ltr;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.up{color:#55c878}.down{color:#ef6666}.flat{color:#e5c04a}
.time{display:block;margin-top:1px;color:#aaa;font-size:12px}
.time.time-stale{color:#fff}
.loading,.error{text-align:center;color:#aaa;padding:12px;font-size:16px}
.error{color:#e77}
@media(max-width:520px){
 main{width:100%;margin:0;padding:6px 5px;border-radius:0;min-height:100vh}
 h1{font-size:24px;margin-bottom:2px}
 .row{grid-template-columns:minmax(76px,.85fr) minmax(0,1.55fr) minmax(86px,.95fr);gap:2px;padding:4px 0;min-height:45px}
 .name{font-size:17px}.price{font-size:19px;letter-spacing:-.45px}
 .price span{font-size:13px!important}.meta{font-size:14px}.time{font-size:12px}
 .controlBtn{min-height:40px}
}
@media(max-width:360px){
 main{padding-left:3px;padding-right:3px}
 .row{grid-template-columns:72px minmax(0,1fr) 82px;gap:1px}
 .name{font-size:16px}.price{font-size:18px;letter-spacing:-.6px}
 .meta{font-size:13px}.time{font-size:12px}
}
</style>
</head>
<body>
<main>
 <h1>قیمت بازار</h1>
 <div class="controls"><button class="controlBtn" id="refreshBtn" type="button">↻ بروزرسانی</button></div>
 <div id="tgju-data"><div class="loading">در حال دریافت اطلاعات...</div></div>
</main>
<script>
(function(){
'use strict';
const SOURCE='https://tgju-api-proxy.vercel.app/api/tgju';
const catalog=[
 {key:'crypto-tether-irr',name:'تتر',unit:'تومان',rial:true,maxAge:30},
 {key:'price_dollar_rl',name:'دلار',unit:'تومان',rial:true,maxAge:30},
 {key:'geram18',name:'گرم ۱۸',unit:'تومان',rial:true,maxAge:30},
 {key:'sekee',name:'سکه امامی',unit:'تومان',rial:true,maxAge:30},
 {key:'ime_fund_kahroba',name:'کهربا',unit:'تومان',rial:true,maxAge:1440},
 {key:'ime_fund_ayar',name:'عیار',unit:'تومان',rial:true,maxAge:1440},
 {key:'ons',name:'انس',unit:'USD',rial:false,maxAge:720,decimals:2},
 {key:'oil_brent',name:'نفت برنت',unit:'USD',rial:false,maxAge:720,decimals:2},
 {key:'gc30',name:'بورس',unit:'',rial:false,maxAge:720},
 {key:'crypto-bitcoin',name:'بیت‌کوین',unit:'USD',rial:false,maxAge:30,decimals:2}
];
const box=document.getElementById('tgju-data');
const refreshBtn=document.getElementById('refreshBtn');
let lastGoodItems=null;
function faDigits(value){return String(value).replace(/[0-9]/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d])}
function parseNumber(value){
 const normalized=String(value??'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٬,،\s]/g,'').replace(/٫/g,'.');
 const n=Number(normalized);
 return Number.isFinite(n)?n:NaN;
}
function numberText(number,decimals){
 if(!Number.isFinite(number))return '—';
 return faDigits(number.toLocaleString('en-US',{minimumFractionDigits:decimals||0,maximumFractionDigits:decimals||0}));
}
function getChange(item){
 const direction=String(item.dt||'');
 if(direction==='high')return{className:'up',symbol:'▲'};
 if(direction==='low')return{className:'down',symbol:'▼'};
 const percent=Number(item.dp);
 if(Number.isFinite(percent)&&percent>0)return{className:'up',symbol:'▲'};
 if(Number.isFinite(percent)&&percent<0)return{className:'down',symbol:'▼'};
 return{className:'flat',symbol:'●'};
}
function priceText(item,definition){
 let value=parseNumber(item.p);
 if(definition.rial)value/=10;
 return numberText(value,definition.decimals||0);
}
function timeColorClass(raw,changeClass){
 const value=String(raw??'').trim().replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
 if(!value||value==='—')return 'time-stale';
 const match=value.match(/(?:^|\s)(\d{1,2}):(\d{2})(?::(\d{2}))?(?:\s|$)/);
 if(!match)return 'time-stale';
 const h=Number(match[1]),m=Number(match[2]),s=Number(match[3]||0);
 if(h>23||m>59||s>59)return 'time-stale';
 const now=new Date();
 const changed=new Date(now);
 changed.setHours(h,m,s,0);
 const age=now.getTime()-changed.getTime();
 return age>=0&&age<5*60*1000?changeClass:'time-stale';
}
function escapeHtml(value){
 return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function render(current){
 box.innerHTML=catalog.map(definition=>{
  const item=current[definition.key];
  if(!item||item.p===undefined){
   return '<div class="row"><div class="name">'+definition.name+'</div><div class="price">—</div><div class="meta">داده موجود نیست</div></div>';
  }
  const change=getChange(item);
  const percent=Number(item.dp);
  const percentText=Number.isFinite(percent)?Math.abs(percent).toFixed(2)+'%':'—';
  const time=escapeHtml(item.t||'—');
  const timeClass='time '+timeColorClass(item.t,change.className);
  return '<div class="row"><div class="name">'+definition.name+'</div><div class="price '+change.className+'">'+priceText(item,definition)+' <span style="font-size:12px;color:#aaa">'+definition.unit+'</span></div><div class="meta"><span class="'+change.className+'">'+change.symbol+' '+percentText+'</span><span class="'+timeClass+'">'+time+'</span></div></div>';
 }).join('');
}
async function load(){
 refreshBtn.disabled=true;
 refreshBtn.textContent='در حال دریافت...';
 const started=Date.now();
 const requestId=String(started);
 try{
  const response=await fetch(SOURCE+'?_='+requestId,{cache:'no-store',headers:{'Accept':'application/json'}});
  const received=Date.now();
  const duration=received-started;
  if(!response.ok)throw new Error('HTTP '+response.status);
  const data=await response.json();
  const current=data&&data.current;
  if(!current||typeof current!=='object')throw new Error('ساختار current در پاسخ پیدا نشد');
  const available=catalog.filter(x=>current[x.key]&&current[x.key].p!==undefined);
  if(!available.length)throw new Error('هیچ‌یک از شاخص‌های موردنیاز در پاسخ وجود ندارد');
  render(current);
  lastGoodItems=current;
 }catch(error){
  if(!lastGoodItems)box.innerHTML='<div class="error">دریافت اطلاعات ناموفق بود. جزئیات خطا در کادر وضعیت بالاست.</div>';
 }finally{
  refreshBtn.disabled=false;
  refreshBtn.textContent='↻ بروزرسانی';
 }
}
refreshBtn.addEventListener('click',load);
load();
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
</body>
</html>
