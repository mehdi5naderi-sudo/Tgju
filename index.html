<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111111"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>قیمت بازار TGJU</title><style>body{margin:0;background:#111;color:#fff;font-family:Arial,sans-serif}main{width:min(720px,94vw);margin:10px auto;background:#181818;border-radius:16px;padding:14px;box-sizing:border-box}h1{text-align:center;font-size:24px;margin:0 0 6px}.controls{text-align:center;margin:0 0 5px;display:flex;justify-content:center;gap:7px;flex-wrap:wrap}button{font-family:inherit}.controlBtn{background:#2a2a2a;color:#fff;border:1px solid #444;border-radius:8px;padding:8px 15px;font-size:15px;cursor:pointer}.controlBtn:disabled{opacity:.5;cursor:default}#lastRefresh{text-align:center;color:#aaa;font-size:13px;margin:5px 0 8px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 4px;border-bottom:1px solid #2b2b2b;min-height:46px;box-sizing:border-box}.name{min-width:90px;color:#ddd;font-size:17px}.price{flex:1;text-align:center;font-size:20px;font-weight:bold;direction:ltr;white-space:nowrap}.price.up{color:#55c878}.price.down{color:#ef6666}.price.flat{color:#e5c04a}.meta{min-width:145px;text-align:left;direction:ltr;font-size:14px;white-space:nowrap}.up{color:#55c878}.down{color:#ef6666}.flat{color:#e5c04a}.time{display:block;margin-top:3px;color:#aaa;font-size:12px}.loading,.error{text-align:center;color:#aaa;padding:20px;font-size:16px}.error{color:#e77}</style></head>
<body><main><h1>قیمت بازار</h1><div class="controls"><button class="controlBtn" id="refreshBtn" type="button">↻ بروزرسانی</button></div><div id="lastRefresh">آخرین رفرش: —</div><div id="tgju-data"><div class="loading">در حال دریافت اطلاعات...</div></div></main><script>
(function(){
const catalog=[
 {slug:'crypto-tether-irr',name:'تتر',unit:'تومان'},
 {slug:'price_dollar_rl',name:'دلار',unit:'تومان'},
 {slug:'geram18',name:'گرم ۱۸',unit:'تومان'},
 {slug:'ime_fund_kahroba',name:'کهربا',unit:'تومان'},
 {slug:'ime_fund_ayar',name:'عیار',unit:'تومان'},
 {slug:'ons',name:'انس',unit:'USD'},
 {slug:'oil_brent',name:'نفت برنت',unit:'USD'}
];
const defaultSlugs=catalog.map(x=>x.slug),storageKey='tgju-selected-v1';
const box=document.getElementById('tgju-data'),refreshBtn=document.getElementById('refreshBtn'),lastRefresh=document.getElementById('lastRefresh');
let selected=loadSelection();
function faDigits(value){return String(value).replace(/[0-9]/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d])}
function numberText(number,decimals=0){if(!Number.isFinite(number))return '—';return faDigits(number.toLocaleString('en-US',{minimumFractionDigits:decimals,maximumFractionDigits:decimals}))}
function priceText(item){let number;if(item.name==='oil_brent'||item.name==='ons')number=Number(item.p);else if((item.name==='crypto-tether-irr'||item.name==='crypto-tether')&&item.p_irr)number=Number(String(item.p_irr).replace(/,/g,''))/10;else number=Number(item.p)/10;const decimals=(item.name==='ons'||item.name==='oil_brent')?2:0;return numberText(number,decimals)}
function getChange(item){const percent=Number(item.dp);if(Number.isFinite(percent)){if(percent>0)return{className:'up',symbol:'▲'};if(percent<0)return{className:'down',symbol:'▼'};return{className:'flat',symbol:'●'}}const direction=item.dt;if(direction==='high')return{className:'up',symbol:'▲'};if(direction==='low')return{className:'down',symbol:'▼'};return{className:'flat',symbol:'●'}}
function diffText(item){const percent=Number(item.dp);if(!Number.isFinite(percent))return '';return Math.abs(percent).toFixed(2)+'%'}
function loadSelection(){try{const saved=JSON.parse(localStorage.getItem(storageKey)||'null');if(Array.isArray(saved)){const valid=saved.filter(s=>catalog.some(x=>x.slug===s));const missing=defaultSlugs.filter(s=>!valid.includes(s));return valid.concat(missing)}}catch(e){}return defaultSlugs.slice()}
function render(items){const map=new Map(items.map(item=>[item.name,item]));const active=selected.map(slug=>catalog.find(x=>x.slug===slug)).filter(Boolean);box.innerHTML=active.map(w=>{const item=map.get(w.slug);if(!item)return '<div class="row"><div class="name">'+w.name+'</div><div class="price">—</div><div class="meta">داده موجود نیست</div></div>';const change=getChange(item),percent=diffText(item);return '<div class="row"><div class="name">'+w.name+'</div><div class="price '+change.className+'">'+priceText(item)+' <span style="font-size:12px;color:#aaa">'+w.unit+'</span></div><div class="meta"><span class="'+change.className+'">'+change.symbol+' '+percent+'</span><span class="time">'+faDigits(item.t||'—')+'</span></div></div>'}).join('')}
async function load(){refreshBtn.disabled=true;refreshBtn.textContent='در حال بروزرسانی...';try{const api='https://api.tgju.org/v1/widget/tmp?keys='+selected.join(',');const response=await fetch(api,{cache:'no-store'});if(!response.ok)throw new Error('HTTP '+response.status);const data=await response.json();const items=data&&data.response&&Array.isArray(data.response.indicators)?data.response.indicators:[];if(!items.length)throw new Error('No indicators');render(items);lastRefresh.textContent='آخرین رفرش: '+new Date().toLocaleTimeString('fa-IR')}catch(error){box.innerHTML='<div class="error">دریافت اطلاعات TGJU ناموفق بود.<br><br>دکمه بروزرسانی را بزنید.</div>'}finally{refreshBtn.disabled=false;refreshBtn.textContent='↻ بروزرسانی'}}
refreshBtn.onclick=load;load();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});})();
</script></body></html>
