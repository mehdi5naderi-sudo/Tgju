<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TGJU Market</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
main{width:min(720px,94vw);background:#181818;border-radius:16px;padding:18px;box-sizing:border-box}
h1{text-align:center;font-size:20px;margin:0 0 18px}
#tgju-data{min-height:120px}
#debugToggle{display:block;margin:14px auto 0;background:none;border:0;color:#777;font-size:11px;cursor:pointer}
#debug{display:none;margin-top:10px;padding:10px;background:#0b0b0b;border:1px solid #333;border-radius:8px;color:#bbb;font:11px/1.7 monospace;direction:ltr;text-align:left;white-space:pre-wrap;max-height:420px;overflow:auto}
</style>
</head>
<body>
<main>
<h1>قیمت بازار</h1>
<div id="tgju-data">در حال دریافت اطلاعات...</div>
<button id="debugToggle" type="button">Debug</button>
<pre id="debug"></pre>
<tgju id="tgju-widget" type="market-data" items="crypto-tether,ons,geram18,sekee,oil_brent" columns="dot,diff,time" token="webservice"></tgju>
<script>
(function(){
const box=document.getElementById('tgju-data'),debug=document.getElementById('debug'),toggle=document.getElementById('debugToggle'),widget=document.getElementById('tgju-widget');
const api='https://api.tgju.org/v1/widget/tmp?keys=crypto-tether,ons,geram18,sekee,oil_brent';
const log=m=>{debug.textContent+='['+new Date().toLocaleTimeString('fa-IR')+'] '+m+'\n';debug.scrollTop=debug.scrollHeight};
const inspect=()=>{if(!widget){log('ERROR: tgju element not found');return}log('connected='+widget.isConnected+' children='+widget.childElementCount+' innerHTML='+widget.innerHTML.length+' outerHTML='+widget.outerHTML.length+' text='+widget.textContent.trim().length);log('shadowRoot='+(widget.shadowRoot?'YES':'NO'));if(widget.shadowRoot)log('shadowHTML='+widget.shadowRoot.innerHTML.length+' shadowText='+JSON.stringify(widget.shadowRoot.textContent.trim().slice(0,700)));const fs=widget.querySelectorAll('iframe');log('iframes='+fs.length);fs.forEach((f,i)=>log('iframe'+i+'='+f.src));log('preview='+widget.outerHTML.slice(0,1000))};
const inspectNetwork=()=>{try{const entries=performance.getEntriesByType('resource');const hits=entries.filter(e=>/tgju|api|widget/i.test(e.name));log('RESOURCE entries matching tgju/api/widget: '+hits.length);hits.slice(-20).forEach(e=>log('RESOURCE '+e.name+' | '+Math.round(e.duration)+'ms'));}catch(e){log('RESOURCE inspect error: '+e)}};
const inspectApi=async()=>{log('Fetching widget data directly...');try{const r=await fetch(api,{cache:'no-store'});log('API status='+r.status+' ok='+r.ok+' type='+(r.headers.get('content-type')||''));const t=await r.text();log('API response length='+t.length);log('API response preview='+t.slice(0,2500).replace(/\s+/g,' '));}catch(e){log('API FETCH ERROR: '+e.name+' | '+e.message)}};
toggle.onclick=()=>{debug.style.display=debug.style.display==='none'?'block':'none'};
window.addEventListener('error',e=>log('JS ERROR: '+e.message+' @ '+e.filename+':'+e.lineno));
window.addEventListener('unhandledrejection',e=>log('PROMISE ERROR: '+String(e.reason)));
log('Page started');log('Official widget source: https://api.tgju.org/v1/widget/v2');log('Widget items: crypto-tether, ons, geram18, sekee, oil_brent');log('Waiting for official TGJU widget...');
new MutationObserver(()=>{log('TGJU mutation detected');inspect()}).observe(widget,{childList:true,subtree:true,characterData:true,attributes:true});
setTimeout(()=>{log('--- 2s ---');inspect();inspectNetwork();inspectApi()},2000);
setTimeout(()=>{log('--- 6s ---');inspect();inspectNetwork()},6000);
setTimeout(()=>{log('--- 12s ---');inspect();inspectNetwork();log('containerHTML='+box.innerHTML.trim().length)},12000);
})();
</script>
<script src="https://api.tgju.org/v1/widget/v2" defer></script>
</main>
</body>
</html>
