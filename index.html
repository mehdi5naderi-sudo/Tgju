<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111111"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>قیمت بازار TGJU</title><style>body{margin:0;background:#111;color:#fff;font-family:Arial,sans-serif}main{width:min(720px,94vw);margin:30px auto;background:#181818;border-radius:16px;padding:18px;box-sizing:border-box}h1{text-align:center;font-size:24px;margin:0 0 12px}.controls{text-align:center;margin:0 0 10px}#refreshBtn{background:#2a2a2a;color:#fff;border:1px solid #444;border-radius:8px;padding:10px 20px;font-size:15px;cursor:pointer}#refreshBtn:disabled{opacity:.5;cursor:default}#lastRefresh{text-align:center;color:#aaa;font-size:13px;margin:8px 0 16px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 4px;border-bottom:1px solid #2b2b2b}.name{min-width:90px;color:#ddd;font-size:17px}.price{flex:1;text-align:center;font-size:20px;font-weight:bold;direction:ltr}.price.up{color:#55c878}.price.down{color:#ef6666}.price.flat{color:white}.meta{min-width:125px;text-align:left;direction:ltr;font-size:14px}.up{color:#55c878}.down{color:#ef6666}.flat{color:#999}.time{display:block;margin-top:5px;color:#aaa;font-size:12px}.loading,.error{text-align:center;color:#aaa;padding:30px;font-size:16px}.error{color:#e77}#debugToggle{display:block;margin:16px auto 0;background:none;border:0;color:#777;cursor:pointer}#debug{display:none;margin-top:10px;padding:10px;background:#0b0b0b;border:1px solid #333;border-radius:8px;color:#bbb;font:12px/1.7 monospace;direction:ltr;text-align:left;white-space:pre-wrap;max-height:420px;overflow:auto}</style></head>
<body><main><h1>قیمت بازار</h1><div class="controls"><button id="refreshBtn" type="button">↻ بروزرسانی</button></div><div id="lastRefresh">آخرین رفرش: —</div><div id="tgju-data"><div class="loading">در حال دریافت اطلاعات...</div></div><button id="debugToggle" type="button">Debug</button><pre id="debug"></pre><script>
(function(){
const api='https://api.tgju.org/v1/widget/tmp?keys=price_dollar_rl,crypto-tether-irr,ons,geram18,khobarga,oil_brent';
const wanted=[{slug:'price_dollar_rl',name:'دلار',unit:'تومان'},{slug:'crypto-tether-irr',name:'تتر',unit:'تومان'},{slug:'ons',name:'انس طلا',unit:'USD'},{slug:'geram18',name:'طلای ۱۸',unit:'تومان'},{slug:'khobarga',name:'کهربا',unit:'تومان'},{slug:'oil_brent',name:'نفت برنت',unit:'USD'}];
const box=document.getElementById('tgju-data'),debug=document.getElementById('debug'),debugToggle=document.getElementById('debugToggle'),refreshBtn=document.getElementById('refreshBtn'),lastRefresh=document.getElementById('lastRefresh');
function log(message){debug.textContent+='['+new Date().toLocaleTimeString('fa-IR')+'] '+message+'\n'}
function faDigits(value){return String(value).replace(/[0-9]/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d])}
function numberText(number,decimals=0){if(!Number.isFinite(number))return '—';return faDigits(number.toLocaleString('en-US',{minimumFractionDigits:decimals,maximumFractionDigits:decimals}))}
function priceText(item){let number;if(item.name==='oil_brent'||item.name==='ons')number=Number(item.p);else if((item.name==='crypto-tether-irr'||item.name==='crypto-tether')&&item.p_irr)number=Number(String(item.p_irr).replace(/,/g,''))/10;else number=Number(item.p)/10;const decimals=(item.name==='ons'||item.name==='oil_brent')?2:0;return numberText(number,decimals)}
function getChange(item){const direction=item.dt;if(direction==='high')return{className:'up',symbol:'▲'};if(direction==='low')return{className:'down',symbol:'▼'};const current=Number(item.p),reference=Number(item.o);if(!Number.isFinite(current)||!Number.isFinite(reference))return{className:'flat',symbol:''};if(current>reference)return{className:'up',symbol:'▲'};if(current<reference)return{className:'down',symbol:'▼'};return{className:'flat',symbol:'0'}}
function diffText(item){const percent=Number(item.dp);if(!Number.isFinite(percent))return '';return Math.abs(percent).toFixed(2)+'%'}
function render(items){const map=new Map(items.map(item=>[item.name,item]));box.innerHTML=wanted.map(w=>{const item=map.get(w.slug);if(!item)return '<div class="row"><div class="name">'+w.name+'</div><div class="price">—</div><div class="meta">داده موجود نیست</div></div>';const change=getChange(item),percent=diffText(item);log(w.name+': p='+item.p+' o='+item.o+' dt='+item.dt+' => '+change.className);return '<div class="row"><div class="name">'+w.name+'</div><div class="price '+change.className+'">'+priceText(item)+' <span style="font-size:12px;color:#aaa">'+w.unit+'</span></div><div class="meta"><span class="'+change.className+'">'+change.symbol+' '+percent+'</span><span class="time">'+(item.t||'')+'</span></div></div>'}).join('')}
async function load(){refreshBtn.disabled=true;refreshBtn.textContent='در حال بروزرسانی...';try{log('شروع دریافت اطلاعات از API رسمی TGJU');const response=await fetch(api,{cache:'no-store'});log('HTTP status='+response.status);if(!response.ok)throw new Error('HTTP '+response.status);const data=await response.json();const items=data&&data.response&&Array.isArray(data.response.indicators)?data.response.indicators:[];log('تعداد داده‌ها: '+items.length);if(!items.length)throw new Error('No indicators');render(items);const now=new Date();lastRefresh.textContent='آخرین رفرش: '+now.toLocaleTimeString('fa-IR');log('جدول ساخته شد')}catch(error){log('ERROR: '+error.message);box.innerHTML='<div class="error">دریافت اطلاعات TGJU ناموفق بود.<br><br>دکمه بروزرسانی را بزنید.</div>'}finally{refreshBtn.disabled=false;refreshBtn.textContent='↻ بروزرسانی'}}
debugToggle.onclick=function(){debug.style.display=debug.style.display==='none'?'block':'none'};refreshBtn.onclick=load;load();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});})();
</script></main></body></html>
