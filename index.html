<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TGJU Market</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
main{width:min(720px,94vw);background:#181818;border-radius:16px;padding:18px;box-sizing:border-box}
h1{text-align:center;font-size:20px;margin:0 0 18px}
#tgju-data{min-height:120px}
#debugToggle{display:block;margin:14px auto 0;background:none;border:0;color:#777;font-size:11px;cursor:pointer}
#debug{display:none;margin-top:10px;padding:10px;background:#0b0b0b;border:1px solid #333;border-radius:8px;color:#bbb;font:11px/1.7 monospace;direction:ltr;text-align:left;white-space:pre-wrap;max-height:260px;overflow:auto}
</style>
</head>
<body>
<main>
<h1>قیمت بازار</h1>
<div id="tgju-data">در حال دریافت اطلاعات...</div>
<button id="debugToggle" type="button">Debug</button>
<pre id="debug"></pre>

<tgju id="tgju-widget"
  type="market-data"
  items="crypto-tether,ons,geram18,sekee,oil_brent"
  columns="dot,diff,time"
  token="webservice"></tgju>

<script>
(function(){
  const box=document.getElementById('tgju-data');
  const debug=document.getElementById('debug');
  const toggle=document.getElementById('debugToggle');
  const widget=document.getElementById('tgju-widget');
  const start=Date.now();
  const log=(m)=>{debug.textContent+='['+new Date().toLocaleTimeString('fa-IR')+'] '+m+'\n';debug.scrollTop=debug.scrollHeight;};
  toggle.onclick=()=>{debug.style.display=debug.style.display==='none'?'block':'none';};
  window.addEventListener('error',e=>log('JS ERROR: '+e.message+' @ '+e.filename+':'+e.lineno));
  window.addEventListener('unhandledrejection',e=>log('PROMISE ERROR: '+String(e.reason)));
  log('Page started');
  log('Official widget source: https://api.tgju.org/v1/widget/v2');
  log('Widget items: crypto-tether, ons, geram18, sekee, oil_brent');
  log('Waiting for official TGJU widget...');
  const observer=new MutationObserver(()=>{
    const html=widget.innerHTML.trim();
    if(html){
      log('TGJU widget changed. HTML length: '+html.length);
      if(/در حال دریافت|loading/i.test(html)) log('Widget still loading');
      else log('TGJU widget produced content');
    }
  });
  observer.observe(widget,{childList:true,subtree:true,characterData:true});
  setTimeout(()=>{
    const html=widget.innerHTML.trim();
    log('After '+((Date.now()-start)/1000).toFixed(1)+'s: widget HTML length = '+html.length);
    if(!html) log('TIMEOUT: official TGJU widget produced no HTML');
    else log('Widget HTML exists; inspect page output above');
    log('Container HTML length = '+box.innerHTML.trim().length);
  },12000);
})();
</script>
<script src="https://api.tgju.org/v1/widget/v2" defer></script>
</main>
</body>
</html>
