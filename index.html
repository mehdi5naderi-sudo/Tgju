<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111111"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg" type="image/svg+xml">
<title>قیمت بازار TGJU</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:Arial,sans-serif}main{width:min(720px,94vw);margin:30px auto;background:#181818;border-radius:16px;padding:18px;box-sizing:border-box}h1{text-align:center;font-size:24px;margin:0 0 12px}.controls{text-align:center;margin:0 0 10px}#refreshBtn{background:#2a2a2a;color:#fff;border:1px solid #444;border-radius:8px;padding:10px 20px;font-size:15px;cursor:pointer}.note{text-align:center;color:#777;font-size:12px;margin:8px 0 16px}
#tgju-widget{display:block;width:100%;min-height:100px;background:#181818;color:#fff}
/* Keep the official widget compact and dark when its markup is rendered in the page. */
#tgju-widget table{width:100%;border-collapse:collapse;background:#181818;color:#fff;font-size:14px}#tgju-widget th,#tgju-widget td{padding:10px 6px;border-bottom:1px solid #2b2b2b;text-align:center}#tgju-widget th{color:#aaa;font-weight:normal}#tgju-widget a{color:#ddd;text-decoration:none}.loading{text-align:center;color:#aaa;padding:30px;font-size:16px}
</style>
</head>
<body><main>
<h1>قیمت بازار</h1>
<div class="controls"><button id="refreshBtn" type="button">↻ بروزرسانی</button></div>
<div class="note">داده و زمان مستقیماً از Widget رسمی TGJU</div>
<div id="tgju-widget"><div class="loading">در حال دریافت اطلاعات...</div></div>
<script src="https://api.tgju.org/v1/widget/v2" defer></script>
<script>
(function(){
const widget=document.getElementById('tgju-widget');
const refreshBtn=document.getElementById('refreshBtn');
const items='price_dollar_rl,crypto-tether-irr,ons,geram18,ime_fund_kahroba,oil_brent';
function load(){
 refreshBtn.disabled=true;
 refreshBtn.textContent='در حال بروزرسانی...';
 widget.innerHTML='<tgju type="market-data" items="'+items+'" columns="diff,time" token="webservice"></tgju>';
 setTimeout(function(){refreshBtn.disabled=false;refreshBtn.textContent='↻ بروزرسانی'},1800);
}
refreshBtn.onclick=load;
load();
})();
</script>
</main></body></html>
