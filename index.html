<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111111"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>قیمت بازار TGJU</title><style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:#fff;font-family:Arial,sans-serif}
main{width:min(720px,100%);margin:10px auto;background:#181818;border-radius:16px;padding:14px}
h1{text-align:center;font-size:24px;margin:0 0 4px}
.controls{text-align:center;margin:0 0 2px;display:flex;justify-content:center;gap:5px;flex-wrap:wrap}
button{font-family:inherit}
.controlBtn{background:#2a2a2a;color:#fff;border:1px solid #444;border-radius:8px;padding:7px 15px;font-size:16px;cursor:pointer}
.controlBtn:disabled{opacity:.5;cursor:default}
#lastRefresh{text-align:center;color:#aaa;font-size:14px;margin:3px 0 4px}\n#apiStatus{margin:8px 0 10px;padding:10px;border:1px solid #555;border-radius:9px;background:#202020;font-size:14px;line-height:1.8;overflow-wrap:anywhere}#apiStatus.ok{border-color:#287a45;background:#10291a;color:#a9f0bd}#apiStatus.warn{border-color:#9b7824;background:#2c2410;color:#ffe19a}#apiStatus.fail{border-color:#a33;background:#301414;color:#ffb1b1}#apiStatus .detail{display:block;color:#ddd;font-size:12px;direction:ltr;text-align:left;overflow-wrap:anywhere}
.row{display:grid;grid-template-columns:minmax(92px,1fr) minmax(0,1.7fr) minmax(112px,1fr);align-items:center;gap:5px;padding:5px 2px;border-bottom:1px solid #2b2b2b;min-height:46px}
.name{min-width:0;color:#ddd;font-size:17px;text-align:right;white-space:nowrap}
.price{min-width:0;text-align:center;font-size:20px;font-weight:bold;direction:ltr;white-space:nowrap;font-variant-numeric:tabular-nums}
.price.up{color:#55c878}.price.down{color:#ef6666}.price.flat{color:#e5c04a}
.meta{min-width:0;text-align:left;direction:ltr;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.up{color:#55c878}.down{color:#ef6666}.flat{color:#e5c04a}
.time{display:block;margin-top:1px;color:#aaa;font-size:12px}.time.up{color:#55c878}.time.down{color:#ef6666}.time.flat{color:#e5c04a}.time.time-stale{color:#fff}
.loading,.error{text-align:center;color:#aaa;padding:12px;font-size:16px}.error{color:#e77}
@media(max-width:520px){main{width:100%;margin:0;padding:6px 5px;border-radius:0;min-height:100vh}h1{font-size:24px;margin-bottom:2px}.row{grid-template-columns:minmax(76px,.85fr) minmax(0,1.55fr) minmax(86px,.95fr);gap:2px;padding:4px 0;min-height:45px}.name{font-size:17px}.price{font-size:19px;letter-spacing:-.45px}.price span{font-size:13px!important}.meta{font-size:14px}.time{font-size:12px}.controlBtn{min-height:40px}}
@media(max-width:360px){main{padding-left:3px;padding-right:3px}.row{grid-template-columns:72px minmax(0,1fr) 82px;gap:1px}.name{font-size:16px}.price{font-size:18px;letter-spacing:-.6px}.meta{font-size:13px}.time{font-size:12px}}
</style></head>
<body><main><h1>قیمت بازار</h1><div class="controls"><button class="controlBtn" id="refreshBtn" type="button">↻ بروزرسانی</button></div><div id="lastRefresh">آخرین تلاش: —</div><div id="apiStatus" role="status" aria-live="polite">وضعیت API: هنوز آزمایش نشده است.</div><div id="tgju-data"><div class="loading">در حال دریافت اطلاعات...</div></div></main><script>
(function(){
const catalog=[
 {slug:'crypto-tether-irr',name:'تتر',unit:'تومان'},
 {slug:'price_dollar_rl',name:'دلار',unit:'تومان'},
 {slug:'geram18',name:'گرم ۱۸',unit:'تومان'},
 {slug:'sekee',name:'سکه امامی',unit:'تومان'},
 {slug:'ime_fund_kahroba',name:'کهربا',unit:'تومان'},
 {slug:'ime_fund_ayar',name:'عیار',unit:'تومان'},
 {slug:'ons',name:'انس',unit:'USD'},
 {slug:'oil_brent',name:'نفت برنت',unit:'USD'},
 {slug:'gc30',name:'شاخص بورس',unit:''}
];
const defaultSlugs=catalog.map(x=>x.slug),storageKey='tgju-selected-v1';
const box=document.getElementById('tgju-data'),refreshBtn=document.getElementById('refreshBtn'),lastRefresh=document.getElementById('lastRefresh');
let selected=loadSelection();
function faDigits(value){return String(value).replace(/[0-9]/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d])}
function numberText(number,decimals=0){if(!Number.isFinite(number))return '—';return faDigits(number.toLocaleString('en-US',{minimumFractionDigits:decimals,maximumFractionDigits:decimals}))}
function priceText(item){let number;if(item.name==='gc30')number=Number(item.p);else if(item.name==='oil_brent'||item.name==='ons')number=Number(item.p);else if((item.name==='crypto-tether-irr'||item.name==='crypto-tether')&&item.p_irr)number=Number(String(item.p_irr).replace(/,/g,''))/10;else number=Number(item.p)/10;const decimals=(item.name==='ons'||item.name==='oil_brent')?2:0;return numberText(number,decimals)}
function getChange(item){const direction=item.dt;if(direction==='high')return{className:'up',symbol:'▲'};if(direction==='low')return{className:'down',symbol:'▼'};const percent=Number(item.dp);if(Number.isFinite(percent)){if(percent>0)return{className:'up',symbol:'▲'};if(percent<0)return{className:'down',symbol:'▼'};return{className:'flat',symbol:'●'}}if(direction==='high')return{className:'up',symbol:'▲'};if(direction==='low')return{className:'down',symbol:'▼'};return{className:'flat',symbol:'●'}}
function diffText(item){const percent=Number(item.dp);if(!Number.isFinite(percent))return '';return Math.abs(percent).toFixed(2)+'%'}
function timeClass(item,change){const raw=String(item.t??'').trim();if(!raw)return change.className;const normalized=raw.replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));const tm=normalized.match(/(?:^|\s)(\d{1,2}):(\d{2})(?::(\d{2}))?(?:\s|$)/);if(!tm)return change.className;const h=Number(tm[1]),m=Number(tm[2]),s=Number(tm[3]||0);if(h>23||m>59||s>59)return change.className;const dateMatch=normalized.match(/(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/);const now=new Date(),changed=new Date();if(dateMatch)changed.setFullYear(Number(dateMatch[1]),Number(dateMatch[2])-1,Number(dateMatch[3]));else changed.setFullYear(now.getFullYear(),now.getMonth(),now.getDate());changed.setHours(h,m,s,0);const ageMs=now.getTime()-changed.getTime();return ageMs>=0&&ageMs<=5*60*1000?change.className:'time-stale'}
function loadSelection(){try{const saved=JSON.parse(localStorage.getItem(storageKey)||'null');if(Array.isArray(saved)){const valid=saved.filter(s=>catalog.some(x=>x.slug===s));const missing=defaultSlugs.filter(s=>!valid.includes(s));return valid.concat(missing)}}catch(e){}return defaultSlugs.slice()}
function render(items){const map=new Map(items.map(item=>[item.name,item]));const active=selected.map(slug=>catalog.find(x=>x.slug===slug)).filter(Boolean);box.innerHTML=active.map(w=>{const item=map.get(w.slug);if(!item)return '<div class="row"><div class="name">'+w.name+'</div><div class="price">—</div><div class="meta">داده موجود نیست</div></div>';const change=getChange(item),percent=diffText(item),timeCls=timeClass(item,change);return '<div class="row"><div class="name">'+w.name+'</div><div class="price '+change.className+'">'+priceText(item)+' <span style="font-size:12px;color:#aaa">'+w.unit+'</span></div><div class="meta"><span class="'+change.className+'">'+change.symbol+' '+percent+'</span><span class="time '+timeCls+'">'+faDigits(item.t||'—')+'</span></div></div>'}).join('')}
function normalizeDigits(value){return String(value??'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d))}
function parseDataTime(raw){const value=normalizeDigits(String(raw??'').trim());if(!value)return null;const match=value.match(/(\\d{4})[\\/-](\\d{1,2})[\\/-](\\d{1,2}).*?(\\d{1,2}):(\\d{2})(?::(\\d{2}))?/);const now=new Date();if(match){const d=new Date(Number(match[1]),Number(match[2])-1,Number(match[3]),Number(match[4]),Number(match[5]),Number(match[6]||0));return Number.isNaN(d.getTime())?null:d}const tm=value.match(/(?:^|\\s)(\\d{1,2}):(\\d{2})(?::(\\d{2}))?(?:\\s|$)/);if(!tm)return null;const d=new Date();d.setHours(Number(tm[1]),Number(tm[2]),Number(tm[3]||0),0);if(d.getTime()-now.getTime()>5*60*1000)d.setDate(d.getDate()-1);return d}
function showApiStatus(kind,title,details){const status=document.getElementById('apiStatus');status.className=kind;status.innerHTML='<strong>'+title+'</strong>'+details.map(x=>'<span class="detail">'+x+'</span>').join('')}
async function load(){refreshBtn.disabled=true;refreshBtn.textContent='در حال آزمایش API...';const started=Date.now(),stamp=String(started);lastRefresh.textContent='آخرین تلاش: '+new Date(started).toLocaleTimeString('fa-IR');showApiStatus('warn','در حال ارسال درخواست به API TGJU…',['شناسه درخواست: '+stamp]);try{const api='https://api.tgju.org/v1/widget/tmp?keys='+selected.join(',')+'&_ts='+stamp;const response=await fetch(api,{cache:'no-store'});const received=Date.now(),duration=received-started;const cacheInfo=['HTTP: '+response.status+' '+response.statusText,'مدت پاسخ: '+duration+' ms','شناسه درخواست: '+stamp];const age=response.headers.get('age');const cache=response.headers.get('x-cache')||response.headers.get('cf-cache-status');const dateHeader=response.headers.get('date');if(age)cacheInfo.push('HTTP Age: '+age+'s');if(cache)cacheInfo.push('Cache header: '+cache);if(dateHeader)cacheInfo.push('زمان پاسخ سرور: '+dateHeader);if(!response.ok){showApiStatus('fail','خطا: API پاسخ موفق نداد',cacheInfo);throw new Error('HTTP '+response.status)}const data=await response.json();const items=data&&data.response&&Array.isArray(data.response.indicators)?data.response.indicators:[];if(!items.length){showApiStatus('fail','خطا: پاسخ رسید، اما قالب/فهرست قیمت قابل‌خواندن نیست',cacheInfo.concat(['پاسخ JSON دریافت شد؛ تعداد شاخص‌ها: 0']));throw new Error('No indicators')}render(items);const mapped=items.filter(item=>selected.includes(item.name)).length;const times=items.map(item=>({raw:String(item.t??'').trim(),date:parseDataTime(item.t)})).filter(x=>x.raw);const parsed=times.filter(x=>x.date);const newest=parsed.length?new Date(Math.max(...parsed.map(x=>x.date.getTime()))):null;let stale=false,ageMinutes=null;if(newest){ageMinutes=Math.max(0,Math.floor((received-newest.getTime())/60000));stale=received-newest.getTime()>5*60*1000}const detail=cacheInfo.concat(['تعداد شاخص‌های دریافتی: '+items.length,'تعداد شاخص‌های منطبق با کدها: '+mapped,'زمان داده نمونه: '+(times[0]?.raw||'در پاسخ موجود نیست'),newest?'جدیدترین زمان قابل‌تشخیص داده: '+newest.toLocaleString('fa-IR'):'زمان داده قابل‌تشخیص نیست',ageMinutes!==null?'سن جدیدترین داده بر اساس ساعت همین دستگاه: حدود '+ageMinutes+' دقیقه':'سن داده قابل محاسبه نیست']);if(stale){showApiStatus('warn','API پاسخ داده، اما قیمت‌ها قدیمی‌اند!',detail.concat(['نتیجه: دریافت API موفق است؛ مشکل احتمالاً در منبع/کش داده‌های TGJU است.']))}else if(!newest){showApiStatus('warn','API پاسخ داده، اما زمان قیمت‌ها قابل بررسی نیست',detail.concat(['نتیجه: درخواست موفق بود؛ از روی پاسخ نمی‌توان تازه‌بودن قیمت را تأیید کرد.']))}else{showApiStatus('ok','API پاسخ موفق داد و داده‌ها تازه به نظر می‌رسند',detail.concat(['نتیجه: درخواست موفق و زمان داده کمتر از ۵ دقیقه است.']))}lastRefresh.textContent='آخرین تلاش: '+new Date(received).toLocaleTimeString('fa-IR')}catch(error){if(!document.getElementById('apiStatus').classList.contains('fail'))showApiStatus('fail','درخواست API ناموفق بود',['خطا: '+String(error&&error.message||error),'زمان تلاش: '+new Date().toLocaleTimeString('fa-IR')]);if(!box.innerHTML||box.innerHTML.includes('در حال دریافت'))box.innerHTML='<div class="error">دریافت اطلاعات TGJU ناموفق بود. جزئیات خطا در کادر وضعیت API بالاست.</div>'}finally{refreshBtn.disabled=false;refreshBtn.textContent='↻ آزمایش و بروزرسانی API'}}
refreshBtn.onclick=load;load();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});})();
</script></body></html>
