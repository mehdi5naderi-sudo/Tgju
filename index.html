<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TGJU Market</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
main{width:min(720px,94vw);background:#181818;border-radius:16px;padding:18px;box-sizing:border-box}
h1{text-align:center;font-size:20px;margin:0 0 18px}
#tgju-data{min-height:120px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 4px;border-bottom:1px solid #2b2b2b}
.row:last-child{border-bottom:0}
.name{font-size:14px;color:#ddd;min-width:90px}
.price{font-size:17px;font-weight:700;text-align:center;direction:ltr;flex:1}
.price.up{color:#55c878}.price.down{color:#ef6666}.price.flat{color:#fff}
.meta{font-size:11px;min-width:120px;text-align:left;direction:ltr}
.diff{margin-left:8px}.up{color:#55c878}.down{color:#ef6666}.flat{color:#999}
.time{display:block;color:#888;margin-top:4px;font-size:10px}
.loading,.error{text-align:center;color:#aaa;padding:30px 5px;font-size:13px}
.error{color:#e77}
#debugToggle{display:block;margin:14px auto 0;background:none;border:0;color:#777;font-size:11px;cursor:pointer}
#debug{display:none;margin-top:10px;padding:10px;background:#0b0b0b;border:1px solid #333;border-radius:8px;color:#bbb;font:11px/1.7 monospace;direction:ltr;text-align:left;white-space:pre-wrap;max-height:420px;overflow:auto}
</style>
</head>
<body>
<main>
<h1>قیمت بازار</h1>
<div id="tgju-data"><div class="loading">در حال دریافت اطلاعات...</div></div>
<button id="debugToggle" type="button">Debug</button>
<pre id="debug"></pre>
<script>
(function(){
const box=document.getElementById('tgju-data'),debug=document.getElementById('debug'),toggle=document.getElementById('debugToggle');
const api='https://api.tgju.org/v1/widget/tmp?keys=price_dollar_rl,crypto-tether,ons,geram18,sekee,oil_brent';
const wanted=[
 {slug:'price_dollar_rl',name:'دلار',unit:'تومان'},
 {slug:'crypto-tether',name:'تتر',unit:'تومان'},
 {slug:'ons',name:'انس طلا',unit:'USD'},
 {slug:'geram18',name:'طلای ۱۸',unit:'تومان'},
 {slug:'sekee',name:'سکه امامی',unit:'تومان'},
 {slug:'oil_brent',name:'نفت برنت',unit:'USD'}
];
const log=m=>{debug.textContent+='['+new Date().toLocaleTimeString('fa-IR')+'] '+m+'\n';debug.scrollTop=debug.scrollHeight};
const faDigits=s=>String(s).replace(/[0-9]/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const numberText=(n,decimals=0)=>{if(!Number.isFinite(n))return '—';return faDigits(n.toLocaleString('en-US',{minimumFractionDigits:decimals,maximumFractionDigits:decimals}))};
const priceText=(item)=>{
  let n;
  if(item.name==='oil_brent'){
    n=Number(item.p); // نفت برنت: بدون هیچ تقسیم یا تبدیل
  }else if(item.name==='crypto-tether'&&item.p_irr){
    n=Number(String(item.p_irr).replace(/,/g,''))/10;
  }else if(item.name==='ons'){
    n=Number(item.p);
  }else{
    n=Number(item.p)/10;
  }
  const decimals=(item.name==='ons'||item.name==='oil_brent')?2:0;
  return numberText(n,decimals);
};
const diffText=item=>{const d=Number(item.dp);if(!Number.isFinite(d))return {text:'',cls:'flat'};if(d>0)return {text:'▲ '+Math.abs(d).toFixed(2)+'%',cls:'up'};if(d<0)return {text:'▼ '+Math.abs(d).toFixed(2)+'%',cls:'down'};return {text:'0%',cls:'flat'}};
const render=items=>{const map=new Map(items.map(x=>[x.name,x]));box.innerHTML=wanted.map(w=>{const x=map.get(w.slug);if(!x)return '<div class="row"><div class="name">'+w.name+'</div><div class="price">—</div><div class="meta">داده موجود نیست</div></div>';const d=diffText(x);return '<div class="row"><div class="name">'+w.name+'</div><div class="price '+d.cls+'">'+priceText(x)+' <span style="font-size:10px;color:#888">'+w.unit+'</span></div><div class="meta"><span class="diff '+d.cls+'">'+d.text+'</span><span class="time">'+(x.t||'')+'</span></div></div>'}).join('')};
const load=async()=>{log('Page started');log('Source: official TGJU API');log('Request: '+api);try{const r=await fetch(api,{cache:'no-store'});log('HTTP status='+r.status+' ok='+r.ok+' type='+(r.headers.get('content-type')||''));if(!r.ok)throw new Error('HTTP '+r.status);const data=await r.json();const items=data&&data.response&&Array.isArray(data.response.indicators)?data.response.indicators:[];log('Indicators received='+items.length);log('Slugs='+items.map(x=>x.name).join(', '));const oil=items.find(x=>x.name==='oil_brent');if(oil)log('Brent raw p='+oil.p+' (NO DIVISION)');if(!items.length)throw new Error('No indicators in response');render(items);log('Rendered '+wanted.length+' market rows');}catch(e){log('FETCH ERROR: '+e.name+' | '+e.message);box.innerHTML='<div class="error">دریافت اطلاعات TGJU ناموفق بود.<br>صفحه را Refresh کنید.</div>'}};
toggle.onclick=()=>{debug.style.display=debug.style.display==='none'?'block':'none'};
window.addEventListener('error',e=>log('JS ERROR: '+e.message+' @ '+e.filename+':'+e.lineno));
window.addEventListener('unhandledrejection',e=>log('PROMISE ERROR: '+String(e.reason)));
load();
})();
</script>
</main>
</body>
</html>
