plugins { id 'com.android.application' }

android {
    namespace 'com.mehdi.tgjuwidget'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mehdi.tgjuwidget'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            def keystoreFile = rootProject.file(System.getenv("ANDROID_KEYSTORE_PATH") ?: "release-key.jks")
            if (keystoreFile.exists()) {
                storeFile = keystoreFile
                storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias = System.getenv("ANDROID_KEY_ALIAS")
                keyPassword = System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}
