name: Build TGJU Native

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "desktop-native/**"
      - ".github/workflows/build-tgju-native.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build resource
        working-directory: desktop-native
        shell: cmd
        run: rc /nologo resource.rc

      - name: Build
        working-directory: desktop-native
        shell: cmd
        run: |
          cl /nologo /O1 /GL /Gy /EHsc /utf-8 /DUNICODE /D_UNICODE main.cpp resource.res /Fe:TGJU-native.exe /link /LTCG /OPT:REF /OPT:ICF /INCREMENTAL:NO /DEBUG:NONE /SUBSYSTEM:WINDOWS user32.lib gdi32.lib shell32.lib winhttp.lib

      - name: Report size
        shell: pwsh
        run: |
          $f = Get-Item desktop-native/TGJU-native.exe
          $kb = [math]::Round($f.Length / 1KB, 1)
          Write-Host "TGJU-native.exe size: $kb KB ($($f.Length) bytes)"

      - uses: actions/upload-artifact@v4
        with:
          name: TGJU-Native-win-x64
          path: desktop-native/TGJU-native.exe

      - name: Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $f = Get-Item desktop-native/TGJU-native.exe
          $kb = [math]::Round($f.Length / 1KB, 1)
          $tag = "native-v1.0.$env:GITHUB_RUN_NUMBER"
          gh release create $tag "desktop-native/TGJU-native.exe" --title "TGJU Native $tag" --notes "Minimal Win32 tray app (~$kb KB). No .NET runtime."
