name: Build TGJU Native

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "desktop-native/**"
      - ".github/workflows/build-tgju-native.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with MSVC
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 call "C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 call "C:\Program Files\Microsoft Visual Studio\2022\Professional\VC\Auxiliary\Build\vcvars64.bat"
          cd desktop-native
          cl /nologo /O2 /EHsc /utf-8 /DUNICODE /D_UNICODE main.cpp /Fe:TGJU-native.exe /link /SUBSYSTEM:WINDOWS user32.lib gdi32.lib shell32.lib winhttp.lib

      - name: Report size
        shell: pwsh
        run: |
          $f = Get-Item desktop-native/TGJU-native.exe
          $kb = [math]::Round($f.Length / 1KB, 1)
          Write-Host "TGJU-native.exe size: $kb KB ($($f.Length) bytes)"

      - uses: actions/upload-artifact@v4
        with:
          name: TGJU-Native-win-x64
          path: desktop-native/TGJU-native.exe

      - name: Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $f = Get-Item desktop-native/TGJU-native.exe
          $kb = [math]::Round($f.Length / 1KB, 1)
          $tag = "native-v1.0.$env:GITHUB_RUN_NUMBER"
          gh release create $tag "desktop-native/TGJU-native.exe" --title "TGJU Native $tag" --notes "Minimal Win32 tray app (~$kb KB). No .NET runtime."
