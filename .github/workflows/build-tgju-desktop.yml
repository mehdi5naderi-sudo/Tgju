name: Build TGJU Desktop

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish portable EXE
        run: dotnet publish TgjuDesktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o publish

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: TGJU-Desktop-win-x64
          path: desktop/publish/TGJU.exe

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "desktop-v1.0.$env:GITHUB_RUN_NUMBER"
          gh release create $tag "publish/TGJU.exe" --title "TGJU Desktop $tag" --notes "Portable TGJU Desktop application. No installer or administrator rights required."
