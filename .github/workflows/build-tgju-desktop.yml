name: Build TGJU Desktop

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "desktop/**"
      - ".github/workflows/build-tgju-desktop.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish portable EXE (trimmed)
        run: >
          dotnet publish TgjuDesktop.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishTrimmed=true
          -p:TrimMode=partial
          -p:PublishReadyToRun=false
          -p:DebugType=None
          -p:DebugSymbols=false
          -o publish

      - name: Report EXE size
        shell: pwsh
        run: |
          $f = Get-Item publish/TGJU.exe
          $mb = [math]::Round($f.Length / 1MB, 2)
          Write-Host "TGJU.exe size: $mb MB ($($f.Length) bytes)"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: TGJU-Desktop-win-x64
          path: desktop/publish/TGJU.exe

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $f = Get-Item publish/TGJU.exe
          $mb = [math]::Round($f.Length / 1MB, 2)
          $tag = "desktop-v1.0.$env:GITHUB_RUN_NUMBER"
          gh release create $tag "publish/TGJU.exe" --title "TGJU Desktop $tag" --notes "Portable TGJU Desktop (~$mb MB). No installer. Self-contained win-x64."
