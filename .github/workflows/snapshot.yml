name: Save TGJU data snapshot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch TGJU data
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          from datetime import datetime, timezone

          url = 'https://api.tgju.org/v1/widget/tmp?keys=price_dollar_rl,crypto-tether-irr,ons,geram18,ime_fund_kahroba,oil_brent'
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          with urllib.request.urlopen(req, timeout=30) as r:
              raw = r.read().decode('utf-8')
          data = json.loads(raw)
          out = {
              'fetched_at': datetime.now(timezone.utc).isoformat(),
              'source': url,
              'response': data.get('response', {})
          }
          with open('data.json', 'w', encoding='utf-8') as f:
              json.dump(out, f, ensure_ascii=False, indent=2)
          print(json.dumps(out, ensure_ascii=False, indent=2))
          PY

      - name: Commit snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.json
          git diff --cached --quiet && exit 0
          git commit -m 'Update TGJU data snapshot'
          git push
