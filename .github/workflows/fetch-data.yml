name: Save TGJU data

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest TGJU data
        run: |
          curl -fsSL 'https://api.tgju.org/v1/widget/tmp?keys=price_dollar_rl,crypto-tether,ons,geram18,sekee,oil_brent' -o data.json
          python3 - <<'PY'
          import json
          with open('data.json','r',encoding='utf-8') as f:
              data=json.load(f)
          if not data.get('response',{}).get('indicators'):
              raise SystemExit('TGJU returned no indicators')
          with open('data.json','w',encoding='utf-8') as f:
              json.dump(data,f,ensure_ascii=False,indent=2)
              f.write('\n')
          PY

      - name: Commit data.json
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.json
          git diff --cached --quiet || git commit -m 'Update TGJU data snapshot'
          git push